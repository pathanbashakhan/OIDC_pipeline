# ============================================================
# qa-plan.yml — Terraform Plan for QA Environment
#
# TRIGGER:  Pull Request → 'qa' branch
# PROMOTION: Open a PR to merge 'dev' into 'qa'.
#            The same Terraform code is promoted automatically.
#            Only the var-file (envs/qa.tfvars) and state key
#            (qa/terraform.tfstate) are different — everything else
#            is identical to dev-plan.yml.
# ============================================================

name: "🔍 QA — Terraform Plan"

on:
  pull_request:
    branches:
      - qa

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: "terraform-qa-plan-pr${{ github.event.pull_request.number }}"
  cancel-in-progress: true

env:
  TF_VERSION:          "1.10.3"
  TF_WORKING_DIR:      "terraform"
  TF_VAR_FILE:         "envs/qa.tfvars"
  TF_STATE_KEY:        "qa/terraform.tfstate"
  TF_INPUT:            "false"
  TF_CLI_ARGS:         "-no-color"
  TF_PLUGIN_CACHE_DIR: "${{ github.workspace }}/.terraform.d/plugin-cache"

jobs:
  terraform-plan:
    name: "Plan — QA"
    runs-on: ubuntu-latest
    environment: QA

    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "💾 Cache Terraform Plugins"
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: "${{ runner.os }}-tf-${{ hashFiles('**/.terraform.lock.hcl') }}"
          restore-keys: "${{ runner.os }}-tf-"

      - name: "📁 Create Plugin Cache Dir"
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}
        working-directory: ${{ github.workspace }}

      - name: "⚙️ Setup Terraform ${{ env.TF_VERSION }}"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      # Uses the QA IAM role (created in oidc/main.tf)
      - name: "🔐 Configure AWS Credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: "GitHubActions-QA-Plan-${{ github.run_id }}"
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-duration-seconds: 3600

      - name: "🚀 Terraform Init"
        id: init
        run: |
          terraform init \
            -reconfigure \
            -backend-config="key=${{ env.TF_STATE_KEY }}"

      - name: "✨ Terraform Format Check"
        id: fmt
        run: terraform fmt -check -recursive -diff
        working-directory: ${{ github.workspace }}

      - name: "✅ Terraform Validate"
        id: validate
        run: terraform validate

      - name: "📋 Terraform Plan"
        id: plan
        run: |
          terraform plan \
            -out=tfplan \
            -detailed-exitcode \
            -var-file="${{ github.workspace }}/${{ env.TF_VAR_FILE }}"
        continue-on-error: true

      - name: "📄 Generate plan.txt"
        run: terraform show -no-color tfplan > plan.txt

      - name: "📤 Upload Plan Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "tfplan-qa-pr${{ github.event.pull_request.number }}"
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan.txt
          retention-days: 7
          if-no-files-found: error

      - name: "💬 Post Plan to PR"
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        env:
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let plan = '';
            try { plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan.txt', 'utf8'); } catch { plan = '_Plan output unavailable_'; }
            if (plan.length > 60000) plan = plan.substring(0, 60000) + '\n\n_(truncated)_';
            const code = process.env.PLAN_EXITCODE;
            const status = code === '0' ? '✅ No Changes' : code === '2' ? '🔄 Changes Detected' : '❌ Plan Failed';
            const body = `## 🔍 Terraform Plan — **QA** Environment
            | Item | Value |
            |---|---|
            | **Status** | ${status} |
            | **Branch** | \`${{ github.head_ref }}\` → \`qa\` |
            | **Artifact** | \`tfplan-qa-pr${{ github.event.pull_request.number }}\` |
            | **Workflow** | [Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            <details><summary>📋 Expand Plan Output</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`
            </details>

            > ⚠️ **On merge, \`qa-apply.yml\` will apply this artifact to AWS QA.**`;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('Terraform Plan — **QA**'));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });

      - name: "🚨 Fail if Plan Errored"
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
